<style>
/* Layout: a parts drawer on the left, one live bench on the right; same paper-and-ink notebook as the line page. */
:root {
  --paper: #fafafa;
  --surface: #f1f0ec;
  --ink: #2c2c2c;
  --muted: #6b6a64;
  --line: #dddcd5;
  --unit: #24493f;
  --unit-ink: #e7efe9;
  --accent: #e87420;
  --sel: #f2a868;
  --hover: #ecece8;
  --display: "Instrument Serif", "Noto Serif SC", Georgia, serif;
  --display-cjk: "Noto Serif SC", "Songti SC", serif;
  --body: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { background: var(--paper); color: var(--ink); }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
.page {
  max-width: 1240px; margin: 0 auto;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 24px;
}
header { display: flex; flex-direction: column; gap: 8px; max-width: 780px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.eyebrow a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.eyebrow a:hover { border-color: var(--accent); }
h1 { margin: 0; font-family: var(--display-cjk); font-weight: 500; font-size: clamp(30px, 4.2vw, 44px); line-height: 1.15; text-wrap: balance; }
h1 .lat { font-family: var(--display); font-weight: 400; font-style: italic; letter-spacing: -.01em; }
.lede { margin: 0; max-width: 66ch; }
.mono { font-family: var(--mono); }

.bench { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } .drawer { order: 2; } }

.drawer { display: flex; flex-direction: column; gap: 14px; min-width: 0; max-height: 82vh; overflow-y: auto; padding-right: 4px; }
@media (max-width: 900px) { .drawer { max-height: none; } }
.drawer h3 { margin: 0 0 4px; font-family: var(--display-cjk); font-weight: 500; font-size: 14px; color: var(--muted); }
.drawer ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.pbtn {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left;
  font: inherit; font-size: 13.5px; color: var(--ink); background: transparent; border: 0; border-radius: 3px; padding: 5px 8px; cursor: pointer;
}
.pbtn:hover { background: var(--hover); }
.pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pbtn[aria-current="true"] { background: var(--ink); color: var(--paper); }
.pbtn .q { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbtn[aria-current="true"] .q { color: #cfcfca; }
.pbtn .nm { min-width: 0; overflow-wrap: anywhere; }

.view { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.step {
  position: absolute; left: 12px; top: 10px; right: 12px; pointer-events: none; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
}
.step .now { background: rgba(250,250,250,.94); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; font-size: 14px; max-width: 46ch; }
.step .hud { font-family: var(--mono); font-size: 12px; background: var(--unit); color: var(--unit-ink); border-radius: 3px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.step .hud:empty { display: none; }
.tags { position: absolute; inset: 0; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -120%); white-space: nowrap; font-family: var(--mono); font-size: 11px; color: var(--ink); background: rgba(250,250,250,.9); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.loadnote { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.controls { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.group { display: inline-flex; background: rgba(250,250,250,.94); border: 1px solid var(--line); border-radius: 4px; pointer-events: auto; }
.group button { font: inherit; font-family: var(--mono); font-size: 12px; color: var(--ink); background: transparent; border: 0; padding: 6px 10px; min-height: 32px; cursor: pointer; border-right: 1px solid var(--line); }
.group button:last-child { border-right: 0; }
.group button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.group button:hover:not([aria-pressed="true"]) { background: var(--hover); }
.group button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.timebar { flex: 1 1 120px; height: 3px; background: var(--line); border-radius: 2px; position: relative; pointer-events: none; min-width: 80px; }
.timebar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 2px; }

.info { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 28px; }
@media (max-width: 760px) { .info { grid-template-columns: minmax(0, 1fr); } }
.info h2 { margin: 0 0 2px; font-family: var(--display-cjk); font-weight: 500; font-size: 22px; line-height: 1.3; }
.info .code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 13.5px; margin: 12px 0 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.steps li { color: var(--muted); transition: color .2s; }
.steps li.on { color: var(--ink); }
.steps li.on::marker { color: var(--accent); font-weight: 700; }
.infohead { font-family: var(--display-cjk); font-weight: 500; font-size: 15px; margin: 0 0 8px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--sel); border: 1px solid #c97a3a; vertical-align: -1px; margin-right: 6px; }
@media (prefers-reduced-motion: reduce) { .steps li { transition: none; } }
</style>
</head>

<div class="page">
  <header>
    <div class="eyebrow"><span>八臂循环产线 · 打印零件</span><a href="loop_cell.html">回到整条产线</a></div>
    <h1>零件模拟 <span class="lat">bench tests</span></h1>
    <p class="lede">每个打印零件放到它实际干活的地方单独演示一遍:怎么装、东西怎么从它上面过去。模型就是导出的 STL,尺寸和 BOM 同一份参数;<span class="swatch" aria-hidden="true"></span>橙色的是当前选中的零件。</p>
  </header>

  <div class="bench">
    <nav class="drawer" id="drawer" aria-label="零件"></nav>
    <div class="view">
      <figure style="margin:0">
        <div class="stage" id="stage">
          <canvas id="cv" aria-label="零件三维演示,可拖动旋转、滚轮缩放"></canvas>
          <div class="tags" id="tags"></div>
          <div class="step"><div class="now" id="stepNow">加载零件模型…</div><div class="hud" id="hud"></div></div>
          <div class="loadnote" id="loadnote">加载零件模型…</div>
          <div class="controls">
            <div class="group" role="group" aria-label="播放">
              <button type="button" id="play" aria-pressed="false">暂停</button>
              <button type="button" id="restart">重播</button>
            </div>
            <div class="group" role="group" aria-label="速度">
              <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
              <button type="button" data-speed="1" aria-pressed="true">1×</button>
            </div>
            <div class="timebar" aria-hidden="true"><i id="tbar"></i></div>
          </div>
        </div>
      </figure>
      <section class="info" aria-live="polite">
        <div>
          <h2 id="pName">—</h2>
          <div class="code" id="pCode"></div>
          <dl class="kv" id="pKv"></dl>
        </div>
        <div>
          <div class="infohead" id="sceneTitle">演示步骤</div>
          <ol class="steps" id="steps"></ol>
        </div>
      </section>
    </div>
  </div>
</div>

    const name = i === 0 && c.names[0].endsWith('_flare') ? `saddle_${fam}_flat` : `saddle_${fam}`;
    const p = post(c.floorZ - D.SADDLE_T, { saddle: GEO[name] ? name : `saddle_${fam}` });
    p.position.set(j.p.x, j.p.y, 0); p.rotation.z = j.h; g.add(p);
  });
  return g;
}
function makeChain(fam, names, floorZ) { const c = chain(fam, names, floorZ); c.names = names; return c; }

// item that travels on a chute of family ``fam``; place(s) puts it on the chain
function item(fam, i = 0) {
  if (fam === 'bottle') return carrier({ fill: [['red', 'green', 'blue'][i % 3], ['green', 'blue', 'red'][i % 3]] });
  if (fam === 'cap') { const g = new THREE.Group(); g.add(P('cap', { plain: true })); return g; }
  const g = new THREE.Group(); const b = sphere(D.BALL_D / 2, M.ball[['red', 'green', 'blue'][i % 3]]); b.position.z = D.BALL_D / 2; g.add(b); g.userData.ball = b; return g;
}
function place(obj, c, s, fam, lift = 0) {
  const a = c.at(s); obj.position.copy(a.p); obj.position.z += lift; obj.rotation.set(0, 0, a.h);
  if (fam === 'ball' && obj.userData.ball) obj.userData.ball.rotation.set(0, s / (D.BALL_D / 2), 0);
}

// ---------- SG90 + lever inside a gate holder (gate frame) ----------
function gateMech(fam, holder) {
  const G = GATE[fam], sg = DATA.sg90;
  const [bl, bt] = sg.body, y1 = G.plate_y[1];
  const bodyG = new THREE.Group();
  const b = shadowy(new THREE.Mesh(new THREE.BoxGeometry(bl, sg.below_ears + 4.5, bt), M.servo));
  b.position.set(0, (4.5 - sg.below_ears) / 2, 0); bodyG.add(b);
  const ears = shadowy(new THREE.Mesh(new THREE.BoxGeometry(sg.ear_w, 2.5, bt), M.servo)); ears.position.set(0, 1.25, 0); bodyG.add(ears);
  bodyG.position.set(G.servo_cx, y1, G.shaft_z); holder.add(bodyG);
  const shaftLen = G.pin_y - D.LEVER_T / 2 - (y1 + 4.5);
  const shaft = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, Math.max(1, shaftLen), 16), M.white));
  shaft.position.set(G.shaft_x, y1 + 4.5 + shaftLen / 2, G.shaft_z); holder.add(shaft);
  const outer = new THREE.Group(); outer.position.set(G.shaft_x, G.pin_y, G.shaft_z); outer.rotation.z = G.dir < 0 ? Math.PI : 0;
  const inner = new THREE.Group(); outer.add(inner);
  const lever = P(`gate_lever_${fam}`); lever.position.x = -3; inner.add(lever);
  holder.add(outer);
  return { set(u) { inner.rotation.y = u * G.release_deg * deg; } };
}
function irBeam(fam, holder) {
  const G = GATE[fam], half = FAM[fam].W / 2 + D.WALL_T + 4;
  const a = new V3(G.head_x, -half, G.beam_z), b = new V3(G.head_x, half, G.beam_z);
  for (const p of [a, b]) { const m = box(6, 6, 10, M.dark); m.position.set(p.x, p.y, p.z - 5); holder.add(m); }
  const line = lineBetween(a, b, BEAM_OFF); holder.add(line);
  return { set(on) { line.material = on ? BEAM_ON : BEAM_OFF; } };
}

SCENES.post = (sel) => {

  const top = 60;
  const pst = post(top, { saddle: flat ? `saddle_${fam}_flat` : `saddle_${fam}` }); root.add(pst);
  const U = pst.userData;
  const up = flat ? null : (() => { const g = new THREE.Group(); const m = P(short); m.position.x = -straightLen(short); g.add(m); root.add(g); return g; })();
  const down = (() => { const g = new THREE.Group(); g.add(P(flat ? `chute_${fam}_flare` : short)); root.add(g); return g; })();
  const zUp = top + D.SADDLE_T, zDown = top + D.SADDLE_T - (flat ? 0 : D.SADDLE_STEP);
  return {
    root, dur: 9,
    steps: [[0, '支柱底座放在台面或拼接块上(拼接块上用 4 颗 M4 锁住)'], [0.6, 'M4 螺杆穿过底座,下端螺母藏在六角槽里'],

    view: { target: [0, 0, 45], dist: 420, az: -58, el: 18 },
  };

SCENES.cones = () => {
  const root = new THREE.Group(), fun = DATA.funnel, hop = DATA.hopper, gap = D.BALL_D + 2, r = D.BALL_D / 2, slope = FAM.ball.slope * deg;
  // M2 floor top at 40; hopper above its start; M1 ends 5 mm over the hopper rim; funnel over M1's start
  const m2Top = 40, hopZ = m2Top + gap, hopTop = hopZ + 6 + hop.h, m1End = hopTop + 5;
  const m1Name = byName.chute_ball_S75 ? 'chute_ball_S75' : straightsOf('ball')[0];
  const dist = Math.round(Math.hypot(hop.xy[0] - fun.xy[0], hop.xy[1] - fun.xy[1]) * 1000), m1Len = straightLen(m1Name);
  const m1Start = m1End + m1Len * Math.tan(slope), funZ = m1Start + gap, funTop = funZ + 6 + fun.h;
  const m1 = makeChain('ball', [m1Name], 0);
  const m1g = new THREE.Group(); m1g.add(m1.group); m1g.position.z = m1Start - D.FLOOR_T; m1g.rotation.y = slope; root.add(m1g);
  const ss = straightsOf('ball'), m2 = makeChain('ball', [ss[ss.length - 1], 'chute_ball_gate'], m2Top - D.FLOOR_T);
  m2.group.position.x = dist; root.add(m2.group);
  const funnel = P('funnel'); funnel.position.set(0, 0, funZ); funnel.rotation.z = Math.PI; root.add(funnel);
  const hopper = P('hopper'); hopper.position.set(dist, 0, hopZ); hopper.rotation.z = -Math.PI / 2; root.add(hopper);
  for (const [x, y, zt] of [[-(fun.top_r + 14), 0, funZ + 6 + fun.h * 0.6], [dist, -(hop.top_r + 14), hopZ + 6 + hop.h * 0.6], [10, 0, m1Start - D.FLOOR_T - 4], [dist + 10, 0, m2Top - D.FLOOR_T - 4], [dist + 80, 0, m2Top - D.FLOOR_T - 4]]) {
    const p = cyl(3.5, zt, M.post, 12); p.position.set(x, y, 0); root.add(p);
  }
  const mouthZ = funTop + 14;
  const bottle = carrier({}); bottle.rotation.x = Math.PI; bottle.position.set(0, 0, mouthZ + CAR.tubeTop); root.add(bottle);
  const grip = gripper(26); grip.userData.set(D.TUBE_OD); grip.rotation.x = Math.PI; grip.position.set(0, 0, mouthZ + CAR.tubeTop - D.GRIP_Z + 13); root.add(grip);
  const rIn = (spec, z0, z) => spec.out_r + (spec.top_r - spec.out_r) * clamp((z - z0 - 6) / spec.h, 0, 1);
  const colors = ['red', 'green', 'blue', 'green'];
  const sHead2 = m2.gate.s0 + GATE.ball.head_x;
  const balls = colors.map((cname) => { const b = sphere(r, M.ball[cname]); root.add(b); return b; });
  // timeline per ball
  const plan = [], vRoll = 170;
  let lastExit = -1;
  colors.forEach((_, i) => {
    const t0 = 0.8 + 0.5 * i, tFun = t0 + 0.25, tSpout = tFun + 0.9, tM1 = tSpout + 0.25, tEnd1 = tM1 + m1Len / vRoll, tHop = tEnd1 + 0.3, tBottom = tHop + 0.8;
    const tExit = Math.max(tBottom, lastExit + 0.7); lastExit = tExit;
    const tM2 = tExit + 0.25, tStop = tM2 + (sHead2 - i * D.BALL_D) / vRoll;
    plan.push({ t0, tFun, tSpout, tM1, tEnd1, tHop, tBottom, tExit, tM2, tStop, a0: i * 1.7 });
  });
  const dur = plan[plan.length - 1].tStop + 2.4;
  const p = new V3();
  function spiral(cx, z0, spec, zA, zB, a0, u, turns) {
    const z = lerp(zA, zB, u), rr = Math.max(0, rIn(spec, z0, z) - r - 1) * (1 - 0.25 * u), a = a0 + turns * u;
    return p.set(cx + rr * Math.cos(a), rr * Math.sin(a), z);
  }
  return {
    root, dur,
    steps: [[0, 'A7 把瓶子倒扣在漏斗上方'], [0.8, '球一颗颗倒出来,顺着漏斗壁转进出口'], [plan[0].tM1, `漏斗出口离球道底面 ${gap} mm,球从下面滚出去`],
      [plan[0].tHop, '球道末端比料斗口高 5 mm,球掉进料斗'], [plan[1].tExit, '料斗出口只比球大三成,一次只放一个'], [plan[0].tStop, '球排到闸门,等 A8 取走、相机认颜色']],
    update(t) {
      balls.forEach((b, i) => {
        const q = plan[i];
        b.visible = t >= q.t0;
        if (t < q.tFun) { const u = lin(t, q.t0, q.tFun); b.position.set(0, 0, lerp(mouthZ - r, funZ + 6 + fun.h * 0.75, u * u)); return; }
        if (t < q.tSpout) { b.position.copy(spiral(0, funZ, fun, funZ + 6 + fun.h * 0.75, funZ + 6 + r, q.a0, lin(t, q.tFun, q.tSpout), 4)); return; }
        if (t < q.tM1) { const u = lin(t, q.tSpout, q.tM1); b.position.set(0, 0, lerp(funZ + 6 + r, m1Start + r, u * u)); return; }
        if (t < q.tEnd1) { const u = lin(t, q.tM1, q.tEnd1); b.position.set(u * m1Len, 0, lerp(m1Start, m1End, u) + r); return; }
        if (t < q.tHop) { const u = lin(t, q.tEnd1, q.tHop); b.position.set(m1Len + 18 * u, 0, lerp(m1End + r, hopZ + 6 + hop.h * 0.6, u * u)); return; }
        const queued = plan.filter((o, j) => j < i && t < o.tExit).length;
        if (t < q.tBottom) {
          const u = lin(t, q.tHop, q.tBottom); const s = spiral(0, hopZ, hop, hopZ + 6 + hop.h * 0.6, hopZ + 6 + r + queued * 14, Math.PI + q.a0, u, 3);
          b.position.set(dist + s.x, s.y, s.z); return;
        }
        if (t < q.tExit) { b.position.set(dist, 0, hopZ + 6 + r + queued * 14); return; }
        if (t < q.tM2) { const u = lin(t, q.tExit, q.tM2); b.position.set(dist, 0, lerp(hopZ + 6 + r, m2Top + r, u * u)); return; }
        const s = Math.min((t - q.tM2) * vRoll, sHead2 - i * D.BALL_D);
        const a = m2.at(s).p; b.position.set(a.x + dist, a.y, m2Top + r); b.rotation.y = s / r;
      });
    },
    tags: [{ text: '漏斗', pos: new V3(0, 0, funTop + 4) }, { text: '料斗', pos: new V3(dist, 0, hopTop + 4) }],
    view: { target: [dist / 2 + 20, 0, 130], dist: 1000, az: -62, el: 18 },
  };
};

SCENES.camera = (sel) => {

  const lens = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 8, 20), M.dark)); lens.position.y = 6; head.add(lens);

  if (cur) {
    if (playing) t = (t + dt * speed) % cur.dur;
    cur.update(t);
    const k = cur.steps.reduce((a, [ts], i) => (t >= ts ? i : a), 0);
    if (k !== stepIdx) {
      stepIdx = k; stepNow.textContent = cur.steps[k][1];
      [...stepsEl.children].forEach((li, i) => li.classList.toggle('on', i === k));
    }
    hudEl.textContent = cur.hud ? cur.hud(t) : '';
    tbar.style.width = `${(t / cur.dur) * 100}%`;
    const w = stage.clientWidth, h = stage.clientHeight;
    for (const g of tagEls) {
      tmp.copy(g.pos).applyMatrix4(cur.root.matrixWorld).project(camera);
      const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
      g.el.style.display = vis ? '' : 'none';
      if (vis) g.el.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * w}px, ${(-tmp.y * 0.5 + 0.5) * h}px) translate(-50%, -120%)`;
    }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

let DATA_MESH = null;
const getJSON = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); });
getJSON('parts_mesh.json').then((data) => {
  DATA_MESH = data;
  for (const [k, m] of Object.entries(data.meshes)) GEO[k] = decode(m);
  loadnote.remove();
  resize(); fromHash(); window.addEventListener('hashchange', fromHash);
  requestAnimationFrame(frame);
  getJSON('so100_mesh.json').then((so) => {
    SO = {};
    for (const v of DATA.arm.visuals) if (so.meshes[v.mesh]) SO[v.mesh] = decode(so.meshes[v.mesh], 1000);
    if (SEL && SEL.scene === 'clamp') select(SEL);
  }).catch(() => {});
}).catch((e) => { loadnote.textContent = `零件模型(parts_mesh.json)加载失败:${e.message}`; stepNow.textContent = '零件模型加载失败'; });
</script>
